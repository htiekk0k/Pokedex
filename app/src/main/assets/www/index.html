<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokédex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2Z"/></symbol>
  <symbol id="i-cam" viewBox="0 0 24 24"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9Zm3 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></symbol>
  <symbol id="i-img" viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm0 13v3h14v-2.6l-4-4-4.5 4.5-2.5-2.4L5 16Zm3.5-9a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/></symbol>
  <symbol id="i-lens" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3V2H5a3 3 0 0 0-3 3v3h2Zm12-6v2h3a1 1 0 0 1 1 1v3h2V5a3 3 0 0 0-3-3h-3ZM4 16H2v3a3 3 0 0 0 3 3h3v-2H5a1 1 0 0 1-1-1v-3Zm16 0v3a1 1 0 0 1-1 1h-3v2h3a3 3 0 0 0 3-3v-3h-2Zm-8-9a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15.4 4.6 8 12l7.4 7.4-1.4 1.4L5.2 12 14 3.2l1.4 1.4Z"/></symbol>
  <symbol id="i-speak" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3Zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4ZM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6Z"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1Zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm0 16H8V7h11v14Z"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 3v2h3.6l-9.8 9.8 1.4 1.4L19 6.4V10h2V3h-7ZM19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7Z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4Z"/></symbol>
</svg>

<!-- ============================ HOME ============================ -->
<main id="home" class="view">
  <header class="shell">
    <div class="shell-top">
      <div class="lens" aria-hidden="true"><i></i></div>
      <div class="leds" aria-hidden="true"><b class="r"></b><b class="y"></b><b class="g"></b></div>
      <h1>Pokédex</h1>
      <button class="gen-pill" id="genPill" type="button" aria-label="Generation settings"></button>
    </div>
    <div class="finder">
      <label class="search">
        <input id="q" type="search" placeholder="Name or number" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      </label>
      <div class="finder-tools">
        <button type="button" class="tool" data-act="voice" aria-label="Voice search"><svg><use href="#i-mic"/></svg><span>Say it</span></button>
        <button type="button" class="tool" data-act="camera" aria-label="Scan a card name with the camera"><svg><use href="#i-cam"/></svg><span>Scan card</span></button>
        <button type="button" class="tool" data-act="gallery" aria-label="Read a name from a picture"><svg><use href="#i-img"/></svg><span>Picture</span></button>
        <button type="button" class="tool" data-act="lens" aria-label="Identify with Google Lens"><svg><use href="#i-lens"/></svg><span>Lens</span></button>
      </div>
    </div>
  </header>
  <nav class="type-filter scroll" id="typeFilter" aria-label="Filter by type"></nav>
  <p class="count" id="count"></p>
  <ol class="dex-list" id="list"></ol>
  <div id="more" class="more"></div>
  <div id="homeMsg"></div>
</main>

<!-- =========================== DETAIL =========================== -->
<main id="detail" class="view" hidden>
  <header class="bar">
    <button type="button" class="icon-btn" data-act="back" aria-label="Back"><svg><use href="#i-back"/></svg></button>
    <div class="bar-title" id="barTitle"></div>
    <button type="button" class="gen-pill small" id="genPill2" aria-label="Generation settings"></button>
  </header>
  <div id="detailBody"></div>
</main>

<!-- =========================== SHEETS =========================== -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-act="close-sheet"></div>
  <section class="sheet-panel" role="dialog" aria-modal="true">
    <button type="button" class="icon-btn sheet-x" data-act="close-sheet" aria-label="Close"><svg><use href="#i-x"/></svg></button>
    <div id="sheetBody"></div>
  </section>
</div>

<div id="busy" class="busy" hidden>
  <div class="busy-card">
    <div class="lens big pulse" aria-hidden="true"><i></i></div>
    <p id="busyLabel">Reading…</p>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
