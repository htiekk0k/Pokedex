name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build signed APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Pokedex.apk

      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pokedex-apk
          path: Pokedex.apk

      - name: Publish as the latest release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pokédex build ${{ github.run_number }}
          # Shown as "What's new" by the in-app updater
          body: |
            ${{ github.event.head_commit.message }}

            Download **Pokedex.apk** below and open it on your Android phone to install or update.
          files: Pokedex.apk
          make_latest: true
